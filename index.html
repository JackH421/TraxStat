<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TraxStat">
<meta name="theme-color" content="#0a0a0a">
<title>TraxStat — Live Motorsport Timing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0a0a;--surface:#111;--surface2:#181818;--border:#242424;
  --text:#f0f0f0;--muted:#666;--dim:#2a2a2a;
  --red:#e8002d;--green:#00d84a;--yellow:#ffd600;--blue:#4fc3f7;--orange:#ff6b00;--white:#fff;
}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;display:flex;flex-direction:column;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:50px;flex-shrink:0;}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;letter-spacing:0.06em;color:var(--white);}
.logo span{color:var(--red);}
.header-right{display:flex;align-items:center;gap:10px;}
.live-pill{display:flex;align-items:center;gap:5px;background:#1a0000;border:1px solid #3a0000;padding:3px 8px;border-radius:3px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.live-text{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.12em;color:var(--red);}
.refresh-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px;}
.refresh-btn.spinning{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.series-bar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
.series-bar::-webkit-scrollbar{display:none;}
.series-tab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:0.08em;padding:9px 16px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.15s;display:flex;align-items:center;gap:5px;}
.series-tab.active{color:var(--white);border-bottom-color:var(--red);}
.series-dot{width:5px;height:5px;border-radius:50%;background:var(--dim);}
.series-dot.live{background:var(--green);}
.f1-submenu{background:var(--surface2);border-bottom:1px solid var(--border);display:flex;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.f1-submenu::-webkit-scrollbar{display:none;}
.f1-sub-tab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:0.1em;padding:8px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;text-transform:uppercase;}
.f1-sub-tab.active{color:var(--red);border-bottom-color:var(--red);}
.f1-sub-tab.live-tab.active{color:var(--green);border-bottom-color:var(--green);}
.nascar-series-bar{display:flex;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;}
.nascar-series-tab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:0.12em;padding:6px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;text-transform:uppercase;flex:1;text-align:center;}
.nascar-series-tab.active{color:var(--yellow);border-bottom-color:var(--yellow);}
.main-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.next-race-banner{background:linear-gradient(135deg,#0d0d0d 0%,#1a0005 50%,#0d0d0d 100%);border-bottom:1px solid var(--border);padding:14px 16px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;}
.next-race-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.15em;color:var(--red);text-transform:uppercase;margin-bottom:4px;}
.next-race-name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;color:var(--white);line-height:1;}
.next-race-circuit{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);margin-top:3px;}
.next-race-date{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px;}
.countdown-box{text-align:right;flex-shrink:0;}
.countdown-num{font-family:'Share Tech Mono',monospace;font-size:28px;color:var(--yellow);line-height:1;}
.countdown-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-top:2px;}
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;padding:10px 16px 6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.race-item{display:grid;grid-template-columns:44px 1fr auto;align-items:center;padding:9px 16px;border-bottom:1px solid #151515;cursor:pointer;transition:background 0.1s;gap:12px;}
.race-item:active,.race-item.selected{background:#1a0005;}
.round-badge{width:36px;height:36px;border-radius:4px;background:var(--surface2);border:0.5px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.round-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;color:var(--white);line-height:1;}
.round-label{font-family:'Barlow Condensed',sans-serif;font-size:7px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}
.race-item-country{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
.race-item-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--white);line-height:1.1;margin-top:1px;}
.race-item-date{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);margin-top:2px;}
.winner-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text);text-align:right;}
.winner-flag{font-size:12px;text-align:right;display:block;}
.winner-team{font-family:'Barlow',sans-serif;font-size:10px;color:var(--muted);text-align:right;}
.results-header{padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);}
.results-race-name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:var(--white);}
.results-race-sub{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;}
.podium-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);border-bottom:1px solid var(--border);}
.podium-item{background:var(--surface2);padding:10px 8px;text-align:center;}
.podium-pos{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.06em;color:var(--muted);margin-bottom:4px;}
.podium-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;line-height:1;}
.podium-flag{font-size:13px;display:block;margin-bottom:2px;}
.podium-team{font-family:'Barlow',sans-serif;font-size:10px;color:var(--muted);margin-top:2px;}
.podium-gap{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);margin-top:3px;}
.p1-item .podium-name{color:var(--yellow);}
.p2-item .podium-name{color:#c0c0c0;}
.p3-item .podium-name{color:#cd7f32;}
.results-table-header{display:grid;grid-template-columns:28px 20px 1fr 38px 70px 64px 18px;padding:5px 10px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:5;gap:4px;}
.rth{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:600;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase;text-align:right;}
.rth.left{text-align:left;}
.result-row{display:grid;grid-template-columns:28px 20px 1fr 38px 70px 64px 18px;padding:7px 10px;border-bottom:1px solid #141414;align-items:center;cursor:pointer;transition:background 0.1s;gap:4px;}
.result-row:active{background:var(--surface2);}
.result-row.p1-row{background:#0d1a08;}
.result-row.dnf-row{opacity:0.5;}
.result-row.selected-driver{background:#0a0a1a;border-left:2px solid var(--blue);}
.res-pos{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;text-align:center;}
.pos-1{color:var(--white);}
.pos-2{color:#c0c0c0;}
.pos-3{color:#cd7f32;}
.pos-other{color:var(--muted);}
.pos-dnf{color:var(--red);font-size:11px;text-align:center;}
.flag-cell{font-size:12px;text-align:center;}
.res-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;line-height:1.1;}
.res-team-sm{font-family:'Barlow',sans-serif;font-size:9px;color:var(--muted);margin-top:1px;}
.res-pts{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--yellow);text-align:right;}
.res-gap{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);text-align:right;}
.res-gap.leader-gap{color:var(--yellow);font-family:'Barlow Condensed',sans-serif;font-size:10px;}
.res-fastest{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);text-align:right;}
.res-fastest.is-fastest{color:var(--green);font-weight:700;}
.res-fl{font-size:11px;text-align:center;}
.tire-sm{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-left:auto;}
.tire-s{background:#c00020;color:#fff;}
.tire-m{background:#c8a800;color:#000;}
.tire-h{background:#e0e0e0;color:#000;}

/* LAP TIMES PANEL */
.lap-panel{background:var(--surface2);border-top:1px solid var(--border);padding:0;}
.lap-panel-header{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.lap-panel-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--white);}
.lap-panel-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px;}
.lap-panel-sub{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);}
.lap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:1px;background:var(--border);max-height:240px;overflow-y:auto;}
.lap-cell-item{background:var(--bg);padding:7px 10px;display:flex;flex-direction:column;}
.lap-num{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:2px;}
.lap-time{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--text);}
.lap-time.fastest-lap{color:var(--green);}
.lap-time.slow-lap{color:var(--orange);}
.lap-pos{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--muted);margin-top:1px;}
.lap-loading{padding:20px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--muted);}

/* CHAMPIONSHIP */
.champ-row{display:grid;grid-template-columns:28px 20px 1fr 60px 52px;padding:8px 14px;border-bottom:1px solid #141414;align-items:center;}
.champ-pos{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--muted);text-align:center;}
.champ-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;}
.champ-team-sm{font-family:'Barlow',sans-serif;font-size:10px;color:var(--muted);}
.champ-pts{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--yellow);text-align:right;}
.champ-gap{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);text-align:right;}

/* LIVE TIMING */
.timing-header-row{display:grid;grid-template-columns:32px 36px 1fr 70px 80px 56px;padding:5px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;}
.th{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:600;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;text-align:right;}
.th.left{text-align:left;}
.driver-row{display:grid;grid-template-columns:32px 36px 1fr 70px 80px 56px;padding:7px 12px;border-bottom:1px solid #141414;align-items:center;}
.driver-row.p1-live{background:#0d1a08;}
.pos-cell{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;text-align:center;}
.team-color-bar{width:3px;height:28px;border-radius:2px;margin:0 auto;}
.d-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:0.02em;line-height:1.1;}
.d-team{font-family:'Barlow',sans-serif;font-size:10px;color:var(--muted);margin-top:1px;}
.gap-cell{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);text-align:right;}
.gap-leader-cell{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--yellow);text-align:right;letter-spacing:0.05em;}
.lap-cell{font-family:'Share Tech Mono',monospace;font-size:11px;text-align:right;}
.lap-fastest{color:var(--green);}
.lap-normal{color:var(--text);}
.lap-pit{color:var(--orange);}
.tire-cell{display:flex;align-items:center;justify-content:flex-end;gap:3px;}
.tire-badge{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.tire-laps{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border);flex-shrink:0;}
.stat-box{background:var(--surface);padding:7px 10px;}
.stat-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:2px;}
.stat-val{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--text);}
.stat-val.green{color:var(--green);}
.stat-val.yellow{color:var(--yellow);}
.state-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px 20px;text-align:center;}
.state-icon{font-size:32px;opacity:0.4;}
.state-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--text);}
.state-sub{font-size:13px;color:var(--muted);line-height:1.6;max-width:280px;}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12px;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;z-index:100;}
.toast.show{opacity:1;}
.spin-inline{display:inline-block;animation:spin 1s linear infinite;}
.sprint-tag{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;letter-spacing:0.1em;background:var(--orange);color:#000;padding:1px 4px;border-radius:2px;margin-left:4px;vertical-align:middle;}
</style>
</head>
<body>
<div class="header">
  <div class="logo">TRAX<span>STAT</span></div>
  <div class="header-right">
    <div class="live-pill" id="live-pill" style="display:none;"><div class="live-dot"></div><span class="live-text">LIVE</span></div>
    <button class="refresh-btn" id="refresh-btn" onclick="refresh()">⟳</button>
  </div>
</div>
<div class="series-bar">
  <div class="series-tab active" onclick="switchSeries('f1')"><div class="series-dot live"></div>F1</div>
  <div class="series-tab" onclick="switchSeries('nascar')"><div class="series-dot"></div>NASCAR</div>
  <div class="series-tab" onclick="switchSeries('motogp')"><div class="series-dot"></div>MOTOGP</div>
  <div class="series-tab" onclick="switchSeries('wrc')"><div class="series-dot"></div>WRC</div>
  <div class="series-tab" onclick="switchSeries('indycar')"><div class="series-dot"></div>INDYCAR</div>
  <div class="series-tab" onclick="switchSeries('gt3')"><div class="series-dot"></div>GT3/WEC</div>
</div>
<div class="f1-submenu" id="f1-submenu">
  <div class="f1-sub-tab live-tab active" onclick="switchF1Tab('live')" id="tab-live">⬤ LIVE</div>
  <div class="f1-sub-tab" onclick="switchF1Tab('races')" id="tab-races">RACE RESULTS</div>
  <div class="f1-sub-tab" onclick="switchF1Tab('drivers')" id="tab-drivers">DRIVERS</div>
  <div class="f1-sub-tab" onclick="switchF1Tab('constructors')" id="tab-constructors">CONSTRUCTORS</div>
</div>
<div class="f1-submenu" id="nascar-submenu" style="display:none;">
  <div class="f1-sub-tab live-tab active" onclick="switchNascarTab('live')" id="ntab-live">⬤ LIVE</div>
  <div class="f1-sub-tab" onclick="switchNascarTab('races')" id="ntab-races">RACE RESULTS</div>
  <div class="f1-sub-tab" onclick="switchNascarTab('drivers')" id="ntab-drivers">DRIVERS</div>
  <div class="f1-sub-tab" onclick="switchNascarTab('mfrs')" id="ntab-mfrs">MFRS</div>
</div>
<div class="nascar-series-bar" id="nascar-series-bar" style="display:none;">
  <div class="nascar-series-tab active" onclick="switchNascarSeries('cup')" id="nseries-cup">CUP</div>
  <div class="nascar-series-tab" onclick="switchNascarSeries('xfinity')" id="nseries-xfinity">XFINITY</div>
  <div class="nascar-series-tab" onclick="switchNascarSeries('trucks')" id="nseries-trucks">TRUCKS</div>
</div>
<div class="main-content" id="main-content"></div>
<div class="stats-bar">
  <div class="stat-box"><div class="stat-label">Fastest</div><div class="stat-val green" id="stat-1">—</div></div>
  <div class="stat-box"><div class="stat-label">Leader</div><div class="stat-val" id="stat-2">—</div></div>
  <div class="stat-box"><div class="stat-label">Session</div><div class="stat-val yellow" id="stat-3">—</div></div>
  <div class="stat-box"><div class="stat-label">Round</div><div class="stat-val" id="stat-4">—</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── CONSTANTS ─────────────────────────────────────────────────────────────────
const JOLPICA = 'https://api.jolpi.ca/ergast/f1';
// 2026 real team names + brand colors
const TC={'Red Bull Racing':'#3671C6','Red Bull':'#3671C6','Mercedes':'#27F4D2','Ferrari':'#E8002D','McLaren':'#FF8000','Aston Martin':'#358C75','Alpine':'#FF87BC','Williams':'#37BEDD','Haas F1 Team':'#B6BABD','Haas':'#B6BABD','Audi':'#00FFE6','Racing Bulls':'#6692FF','Cadillac':'#C9A468','default':'#888'};
// 2026 driver numbers → team names (real 2026 seats)
// Mercedes: Russell 63, Antonelli 12 · Ferrari: Hamilton 44, Leclerc 16
// McLaren: Norris 4, Piastri 81 · Red Bull: Verstappen 1, Hadjar 6
// Racing Bulls: Lawson 30, Lindblad TBD · Aston Martin: Alonso 14, Stroll 18
// Alpine: Gasly 10, Colapinto 43 · Williams: Sainz 55, Albon 23
// Haas: Bearman 87, Ocon 31 · Audi: Hulkenberg 27, Bortoleto 5
// Cadillac: Perez 11, Bottas 77
const DT={1:'Red Bull',6:'Red Bull',44:'Ferrari',16:'Ferrari',4:'McLaren',81:'McLaren',63:'Mercedes',12:'Mercedes',14:'Aston Martin',18:'Aston Martin',10:'Alpine',43:'Alpine',23:'Williams',55:'Williams',87:'Haas F1 Team',31:'Haas F1 Team',27:'Audi',5:'Audi',30:'Racing Bulls',77:'Cadillac',11:'Cadillac'};

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentSeries='f1',currentF1Tab='live',selectedRace=null,isLive=false;
let cachedResults={},cachedStandings=null,cachedConstructors=null,cachedLaps={};
let cachedFastestLaps={}; // {round: {driverId: {time, lap, rank}}}
let selectedDriver=null;

// ── UTILS ─────────────────────────────────────────────────────────────────────
const tc=n=>TC[n]||TC['default'];
const posC=p=>p===1?'pos-1':p===2?'pos-2':p===3?'pos-3':'pos-other';
function fmtLap(ms){if(!ms||ms<=0)return'—';const s=ms/1000,m=Math.floor(s/60),sec=(s%60).toFixed(3).padStart(6,'0');return m>0?`${m}:${sec}`:sec;}
function fmtGap(g){if(g===null||g===undefined)return'—';if(g===0)return'LEADER';if(typeof g==='number')return`+${g.toFixed(3)}`;return g;}
function tireBadge(c,a){if(!c)return'<div style="width:20px"></div>';const cl=c.toLowerCase(),cs=cl==='soft'?'tire-s':cl==='medium'?'tire-m':'tire-h',lt=cl[0].toUpperCase(),ag=a!=null?`<span class="tire-laps">${a}L</span>`:'';return`<div class="tire-badge ${cs}">${lt}</div>${ag}`;}
function countdown(ds){const r=new Date(ds+'T13:00:00Z'),n=new Date(),d=r-n;if(d<=0)return null;const dy=Math.floor(d/86400000),hr=Math.floor((d%86400000)/3600000),mn=Math.floor((d%3600000)/60000);if(dy>0)return{num:dy,unit:dy===1?'DAY':'DAYS'};if(hr>0)return{num:hr,unit:'HOURS'};return{num:mn,unit:'MINS'};}
function fmtDate(ds){return new Date(ds+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function setStats(a,b,c,d){['stat-1','stat-2','stat-3','stat-4'].forEach((id,i)=>document.getElementById(id).textContent=[a,b,c,d][i]);}

// Race time string to ms
function lapStrToMs(s){if(!s)return null;const p=s.split(':');if(p.length===2){return(parseInt(p[0])*60+parseFloat(p[1]))*1000;}return parseFloat(s)*1000;}

// Normalize team names returned by Jolpica/Ergast to 2026 display names
function normalizeTeam(name){
  if(!name)return name;
  const map={'Kick Sauber':'Audi','Sauber':'Audi','RB F1 Team':'Racing Bulls','RB':'Racing Bulls','Red Bull':'Red Bull','AlphaTauri':'Racing Bulls'};
  return map[name]||name;
}

// ── JOLPICA API ───────────────────────────────────────────────────────────────
async function jolpica(path){
  const res=await fetch(`${JOLPICA}/${path}`);
  if(!res.ok)throw new Error(`API error ${res.status}`);
  return res.json();
}

async function fetchRaceList(){
  const data=await jolpica('2026/results/?limit=30');
  return data.MRData.RaceTable.Races||[];
}

async function fetchRaceResults(round){
  if(cachedResults[round])return cachedResults[round];
  // Hardcoded takes precedence for rounds we've manually verified
  if(HARDCODED_RACES[round]){cachedResults[round]=HARDCODED_RACES[round];return HARDCODED_RACES[round];}
  try{
    const data=await jolpica(`2026/${round}/results/?limit=30`);
    const results=data.MRData.RaceTable.Races[0]||null;
    if(results)cachedResults[round]=results;
    return results;
  }catch(e){return HARDCODED_RACES[round]||null;}
}

async function fetchDriverStandings(){
  if(cachedStandings)return cachedStandings;
  // Jolpica may lag for current season — use hardcoded verified standings if API fails or returns stale data
  try{
    const data=await jolpica('2026/driverStandings/');
    const standings=data.MRData.StandingsTable.StandingsLists[0]?.DriverStandings||[];
    // If standings look incomplete (less than 4 races' worth), fall back to hardcoded
    if(standings.length>0 && parseFloat(standings[0].points)>=90){
      cachedStandings=standings;
      return standings;
    }
  }catch(e){}
  cachedStandings=HARDCODED_DRIVER_STANDINGS;
  return HARDCODED_DRIVER_STANDINGS;
}

async function fetchConstructorStandings(){
  if(cachedConstructors)return cachedConstructors;
  try{
    const data=await jolpica('2026/constructorStandings/');
    const standings=data.MRData.StandingsTable.StandingsLists[0]?.ConstructorStandings||[];
    if(standings.length>0 && parseFloat(standings[0].points)>=170){
      cachedConstructors=standings;
      return standings;
    }
  }catch(e){}
  cachedConstructors=HARDCODED_CONSTRUCTOR_STANDINGS;
  return HARDCODED_CONSTRUCTOR_STANDINGS;
}

async function fetchLapTimes(round,driverId){
  const key=`${round}_${driverId}`;
  if(cachedLaps[key])return cachedLaps[key];
  const data=await jolpica(`2026/${round}/drivers/${driverId}/laps/?limit=100`);
  const laps=data.MRData.RaceTable.Races[0]?.Laps||[];
  cachedLaps[key]=laps;
  return laps;
}

// Fetch each driver's personal fastest lap for a given round.
// Tries Jolpica's fastest endpoint (1..20). Falls back to seeded data for
// hardcoded races. Returns {driverId: {time, lap, rank}}.
async function fetchFastestLaps(round){
  if(cachedFastestLaps[round])return cachedFastestLaps[round];
  const out={};
  // Seed verified overall race fastest laps so they appear instantly
  const seeded=SEEDED_FASTEST_LAPS[round]||{};
  Object.assign(out,seeded);
  // Try Jolpica — it has FastestLap embedded in /results, sometimes
  try{
    const data=await jolpica(`2026/${round}/results/?limit=30`);
    const results=data.MRData.RaceTable.Races[0]?.Results||[];
    results.forEach(r=>{
      if(r.FastestLap&&r.FastestLap.Time){
        const drvId=r.Driver?.driverId;
        if(drvId&&!out[drvId]){
          out[drvId]={time:r.FastestLap.Time.time,lap:r.FastestLap.lap,rank:r.FastestLap.rank};
        }
      }
    });
  }catch(e){}
  cachedFastestLaps[round]=out;
  return out;
}

// ── RACE SELECTOR ─────────────────────────────────────────────────────────────
async function renderRaceSelector(){
  const content=document.getElementById('main-content');
  content.innerHTML=renderNextBanner()+`<div class="section-title"><span>2026 Season Results</span><span class="spin-inline">⟳</span></div>`;
  // Use hardcoded races since they're fully verified — Jolpica may be incomplete
  const allRaces=Object.values(HARDCODED_RACES).sort((a,b)=>parseInt(a.round)-parseInt(b.round));
  if(!allRaces.length){content.innerHTML+=`<div class="state-screen"><div class="state-icon">🏁</div><div class="state-title">No Results Yet</div><div class="state-sub">Race results will appear here after each round.</div></div>`;return;}
  const rows=allRaces.map(r=>{
    const winner=r.Results?.[0];
    const dname=winner?.Driver?.familyName||'—';
    const team=winner?.Constructor?.name||'—';
    const nat=winner?.Driver?.nationality||'';
    const flag=driverFlag(nat);
    const isSelected=selectedRace&&String(selectedRace.round)===String(r.round);
    return`<div class="race-item ${isSelected?'selected':''}" onclick="selectRace('${r.round}')">
      <div class="round-badge"><div class="round-num">${r.round}</div><div class="round-label">RND</div></div>
      <div>
        <div class="race-item-country">${r.Circuit?.Location?.country||''}</div>
        <div class="race-item-name">${r.raceName.replace(' Grand Prix','')}</div>
        <div class="race-item-date">${fmtDate(r.date)}</div>
      </div>
      <div>
        <span class="winner-flag">${flag}</span>
        <div class="winner-name">${dname}</div>
        <div class="winner-team">${team}</div>
      </div>
    </div>`;
  }).join('');
  content.innerHTML=renderNextBanner()+`<div class="section-title"><span>2026 Season Results</span><span>${allRaces.length} races</span></div>`+rows;
  if(selectedRace){
    content.innerHTML+=await buildRaceResultsHTML(selectedRace.round);
    setTimeout(()=>{const el=document.querySelector('.results-header');if(el)el.scrollIntoView({behavior:'smooth'});},100);
  }
  setStats('—','—','RACE',`${allRaces.length} done`);
}

// ── RACE RESULTS ──────────────────────────────────────────────────────────────
async function buildRaceResultsHTML(round){
  const race=await fetchRaceResults(round);
  if(!race)return'<div class="state-screen"><div class="state-icon">🏁</div><div class="state-title">No Data</div></div>';
  const results=race.Results||[];
  const top3=results.slice(0,3);
  const fl=results.find(r=>r.FastestLap?.rank==='1');
  const totalLaps=results[0]?.laps||'—';
  const sprint=SPRINT_RESULTS[round];
  // Pull per-driver fastest laps (seeded + whatever Jolpica returns)
  const flMap=await fetchFastestLaps(round);

  const podium=`<div class="podium-bar">
    <div class="podium-item p2-item">
      <div class="podium-pos">🥈 P2</div>
      <span class="podium-flag">${driverFlag(top3[1]?.Driver?.nationality)}</span>
      <div class="podium-name">${top3[1]?.Driver?.familyName||'—'}</div>
      <div class="podium-team">${top3[1]?.Constructor?.name||'—'}</div>
      <div class="podium-gap">${top3[1]?.Time?.time||top3[1]?.status||'—'}</div>
    </div>
    <div class="podium-item p1-item">
      <div class="podium-pos">🏆 WINNER</div>
      <span class="podium-flag">${driverFlag(top3[0]?.Driver?.nationality)}</span>
      <div class="podium-name">${top3[0]?.Driver?.familyName||'—'}</div>
      <div class="podium-team">${top3[0]?.Constructor?.name||'—'}</div>
      <div class="podium-gap">RACE WINNER</div>
    </div>
    <div class="podium-item p3-item">
      <div class="podium-pos">🥉 P3</div>
      <span class="podium-flag">${driverFlag(top3[2]?.Driver?.nationality)}</span>
      <div class="podium-name">${top3[2]?.Driver?.familyName||'—'}</div>
      <div class="podium-team">${top3[2]?.Constructor?.name||'—'}</div>
      <div class="podium-gap">${top3[2]?.Time?.time||top3[2]?.status||'—'}</div>
    </div>
  </div>`;

  const header=`<div class="results-header">
    <div class="results-race-name">${race.Circuit?.Location?.country||''} ${race.raceName}${sprint?'<span class="sprint-tag">SPRINT WKND</span>':''}</div>
    <div class="results-race-sub">${race.Circuit?.circuitName||''} · Round ${race.round} · ${totalLaps} Laps<br>
    ${fl?`⚡ Fastest Lap: ${fl.FastestLap?.Time?.time||'—'} — ${fl.Driver?.familyName||'—'} (Lap ${fl.FastestLap?.lap||'—'})`:''}
    ${sprint?`<br>🏃 Sprint Winner: ${sprint.winner} (${sprint.winnerTeam}) — top 8 scored points`:''}
    </div>
  </div>`;

  const tableHeader=`<div class="results-table-header">
    <div class="rth left">POS</div><div class="rth"></div>
    <div class="rth left">DRIVER</div>
    <div class="rth">PTS</div><div class="rth">GAP / TIME</div>
    <div class="rth">FASTEST</div><div class="rth"></div>
  </div>`;

  const rows=results.map((r,i)=>{
    const name=r.Driver?.familyName||'—';
    const team=r.Constructor?.name||'—';
    const nat=r.Driver?.nationality||'';
    const flag=driverFlag(nat);
    const pts=parseFloat(r.points)||0;
    const pos=r.position;
    const isDns=pos==='DNS';
    const isDnf=pos==='DNF'||(r.status&&r.status.includes('DNF'));
    const numPos=isDnf||isDns?null:parseInt(pos);
    const gap=numPos===1?(r.Time?.time||'WINNER'):(r.Time?.time?r.Time.time:r.status||'—');
    const driverId=r.Driver?.driverId||'';
    const isSelected=selectedDriver===driverId;
    const posLabel=isDns?'DNS':isDnf?'DNF':numPos;
    const posClass=isDns||isDnf?'pos-dnf':posC(numPos);
    // Resolve this driver's personal fastest lap
    const drvFl=flMap[driverId]||(r.FastestLap?{time:r.FastestLap.Time?.time,lap:r.FastestLap.lap,rank:r.FastestLap.rank}:null);
    const flTime=drvFl?.time||'';
    const isOverallFl=drvFl?.rank==='1';
    const flCellClass=isOverallFl?'res-fastest is-fastest':'res-fastest';
    const flDisplay=flTime?(isOverallFl?`⚡${flTime}`:flTime):'—';
    return`<div class="result-row ${numPos===1?'p1-row':''} ${isDnf||isDns?'dnf-row':''} ${isSelected?'selected-driver':''}" onclick="toggleLaps('${driverId}','${name}','${round}')">
      <div class="res-pos ${posClass}">${posLabel}</div>
      <div class="flag-cell">${flag}</div>
      <div>
        <div class="res-name" style="color:${tc(team)}">${name}</div>
        <div class="res-team-sm">${team}</div>
      </div>
      <div class="res-pts">${pts>0?'+'+pts:'—'}</div>
      <div class="res-gap ${numPos===1?'leader-gap':''}">${gap}</div>
      <div class="${flCellClass}">${flDisplay}</div>
      <div></div>
    </div>`;
  }).join('');

  const lapPanel=selectedDriver?`<div class="lap-panel" id="lap-panel">
    <div class="lap-panel-header">
      <div>
        <div class="lap-panel-title">${selectedDriver} — Lap Times</div>
        <div class="lap-panel-sub">Tap a lap to see details · ⚡ = fastest lap</div>
      </div>
      <button class="lap-panel-close" onclick="closeLaps()">✕</button>
    </div>
    <div id="lap-grid-content"><div class="lap-loading">⟳ Loading lap times...</div></div>
  </div>`:'';

  return header+podium+tableHeader+rows+lapPanel;
}

async function toggleLaps(driverId,name,round){
  if(!driverId)return;
  if(selectedDriver===driverId){
    selectedDriver=null;
    await renderRaceSelector();
    return;
  }
  selectedDriver=driverId;
  await renderRaceSelector();
  const grid=document.getElementById('lap-grid-content');
  if(!grid)return;
  try{
    const laps=await fetchLapTimes(round,driverId);
    if(!laps.length){grid.innerHTML='<div class="lap-loading">No lap time data available from Jolpica yet</div>';return;}
    let fastest=Infinity;
    laps.forEach(lap=>{
      const ms=lapStrToMs(lap.Timings?.[0]?.time);
      if(ms&&ms<fastest)fastest=ms;
    });
    const cells=laps.map(lap=>{
      const timing=lap.Timings?.[0];
      const ms=lapStrToMs(timing?.time);
      const isFast=ms&&Math.abs(ms-fastest)<1;
      const isSlow=ms&&ms>fastest*1.05;
      const pos=timing?.position||'—';
      return`<div class="lap-cell-item">
        <div class="lap-num">LAP ${lap.number}</div>
        <div class="lap-time ${isFast?'fastest-lap':isSlow?'slow-lap':''}">${timing?.time||'—'}</div>
        <div class="lap-pos">P${pos}</div>
      </div>`;
    }).join('');
    grid.innerHTML=`<div class="lap-grid">${cells}</div>`;
  }catch(e){
    grid.innerHTML='<div class="lap-loading">Lap times not yet available</div>';
  }
}

function closeLaps(){
  selectedDriver=null;
  renderRaceSelector();
}

async function selectRace(round){
  selectedRace={round};
  selectedDriver=null;
  await renderRaceSelector();
  setTimeout(()=>{const el=document.querySelector('.results-header');if(el)el.scrollIntoView({behavior:'smooth'});},100);
}

function renderDriverBreakdown(name,team,totalPts){
  const races=DRIVER_RACE_POINTS[name]||[];
  if(!races.length)return'';

  // Build race rows — for sprint weekends, render a sprint sub-row in orange
  const raceRows=races.map(r=>{
    const sprintPts=getSprintPts(name,r.round);
    const sprintRow=sprintPts>0?`
      <div style="display:grid;grid-template-columns:28px 1fr auto auto;align-items:center;padding:3px 16px 6px;border-bottom:1px solid #141414;gap:10px;background:#0d0805;">
        <div></div>
        <div style="font-family:'Barlow',sans-serif;font-size:10px;color:var(--orange);letter-spacing:0.05em;">🏃 SPRINT</div>
        <div></div>
        <div style="font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--orange);text-align:right;min-width:36px;">+${sprintPts}</div>
      </div>`:'';
    return`<div style="display:grid;grid-template-columns:28px 1fr auto auto;align-items:center;padding:8px 16px;border-bottom:1px solid #141414;gap:10px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);text-align:center;">R${r.round}</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:13px;">${r.flag}</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text);">${r.race}</span>
      </div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:12px;color:${posColor(r.pos)};text-align:right;">${posLabel(r.pos)}</div>
      <div style="font-family:'Share Tech Mono',monospace;font-size:13px;color:${r.pts>0?'var(--yellow)':'var(--muted)'};text-align:right;min-width:36px;">${r.pts>0?'+'+r.pts:'—'}</div>
    </div>${sprintRow}`;
  }).join('');

  // Mini bar chart of GP+sprint combined points per weekend
  const maxPts=33; // max possible weekend (25 GP + 8 sprint)
  const bars=races.map(r=>{
    const sprintPts=getSprintPts(name,r.round);
    const total=r.pts+sprintPts;
    const h=total>0?Math.max(4,Math.round((total/maxPts)*40)):2;
    return`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;">
      <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:${total>0?'var(--yellow)':'var(--muted)'};">${total>0?total:''}</div>
      <div style="width:100%;max-width:32px;height:${h}px;background:${total>0?'var(--red)':'var(--dim)'};border-radius:2px 2px 0 0;"></div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:9px;color:var(--muted);letter-spacing:0.04em;">${r.flag}</div>

function teamRoundTotal(teamName,round){
  const races=CONSTRUCTOR_RACE_POINTS[teamName]||[];
  const r=races.find(x=>x.round===round);
  if(!r)return 0;
  const gpPts=r.drivers.reduce((s,d)=>s+(d.pts||0),0);
  const sprintPts=r.drivers.reduce((s,d)=>s+getSprintPts(d.name,round),0);
  return gpPts+sprintPts;
}

function renderConstructorBreakdown(name,totalPts){
  const races=CONSTRUCTOR_RACE_POINTS[name]||[];
  if(!races.length)return'';
  const maxPts=50; // max weekend (1-2 GP + sprint 1-2)

    const total=teamRoundTotal(name,r.round);
    const h=total>0?Math.max(4,Math.round((total/maxPts)*40)):2;

      <div style="display:grid;grid-template-columns:28px 1fr auto;align-items:center;padding:8px 16px 4px;gap:10px;">

// Builds a friendly "between races" view for the LIVE tab when no session is running.
// Shows the next race banner + last completed race recap, instead of empty/error states.
// Generic — takes a context object so F1 and NASCAR can both use it.
function renderLiveOffAir(reason, ctx){
  ctx = ctx || {series:'f1', races:HARDCODED_RACES, banner:renderNextBanner(), seriesLabel:'F1'};
  const banner = ctx.banner;
  const completed = Object.values(ctx.races).sort((a,b)=>parseInt(b.round)-parseInt(a.round));
  const last = completed[0];
  let recap = '';
  if(last){
    const w=last.Results[0],p2=last.Results[1],p3=last.Results[2];
    const lastLabel = ctx.lastLabel || `Last Race · Round ${last.round}`;
    const viewTab = ctx.viewTab || 'races'; // tab to switch to
    const switchFn = ctx.switchFn || 'switchF1Tab';
    recap=`<div class="section-title"><span>${lastLabel}</span><span>${fmtDate(last.date)}</span></div>
    <div style="padding:14px 16px;background:var(--surface2);border-bottom:1px solid var(--border);">

        <div><span style="color:var(--yellow);font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:0.1em;">🏆 P1</span><div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;color:${tc(w?.Constructor?.name)};">${w?.Driver?.familyName||'—'}</div></div>
        <div><span style="color:#c0c0c0;font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:0.1em;">🥈 P2</span><div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;color:${tc(p2?.Constructor?.name)};">${p2?.Driver?.familyName||'—'}</div></div>
        <div><span style="color:#cd7f32;font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:0.1em;">🥉 P3</span><div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;color:${tc(p3?.Constructor?.name)};">${p3?.Driver?.familyName||'—'}</div></div>
      </div>
      <div onclick="${switchFn}('${viewTab}')" style="margin-top:12px;font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--red);letter-spacing:0.08em;cursor:pointer;">VIEW FULL RESULTS →</div>
    </div>`;
  }
  const status=`<div style="padding:18px 16px;text-align:center;background:var(--bg);">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);letter-spacing:0.1em;">⬤ NO ${ctx.seriesLabel} SESSION ON TRACK</div>
    <div style="font-family:'Barlow',sans-serif;font-size:11px;color:var(--muted);margin-top:4px;">Live timing will activate when the next session starts.</div>
  </div>`;
  return banner+status+recap;
}

async function renderLive(){
  const content=document.getElementById('main-content');
  content.innerHTML=`<div class="state-screen"><div class="state-icon">🏎</div><div class="state-title">Connecting...</div><div class="state-sub">Fetching live F1 timing data</div></div>`;
  try{
    const sessRes=await fetch('https://api.openf1.org/v1/sessions?session_type!=Testing&year=2026');
    const sessions=await sessRes.json();
    const now=new Date();
    let session=sessions.find(s=>new Date(s.date_start)<=now&&new Date(s.date_end)>=now);
    isLive=!!session;
    document.getElementById('live-pill').style.display=isLive?'flex':'none';
    if(!session){
      content.innerHTML=renderLiveOffAir('no-session');
      setStats('—','—','STANDBY','R4');return;
    }
    const sk=session.session_key,st=session.session_type||'Session';
    const [drs,pos,lps,sts,ivs]=await Promise.all([
      fetch(`https://api.openf1.org/v1/drivers?session_key=${sk}`).then(r=>r.json()),
      fetch(`https://api.openf1.org/v1/position?session_key=${sk}`).then(r=>r.json()),
      fetch(`https://api.openf1.org/v1/laps?session_key=${sk}`).then(r=>r.json()),
      fetch(`https://api.openf1.org/v1/stints?session_key=${sk}`).then(r=>r.json()),
      fetch(`https://api.openf1.org/v1/intervals?session_key=${sk}`).then(r=>r.json()).catch(()=>[])
    ]);
    const dm={};drs.forEach(d=>{dm[d.driver_number]=d;});
    const positions={};pos.forEach(p=>{if(!positions[p.driver_number]||p.date>positions[p.driver_number].date)positions[p.driver_number]=p;});
    const ld={};lps.forEach(l=>{if(!ld[l.driver_number])ld[l.driver_number]=[];ld[l.driver_number].push(l);});
    const stints={};sts.forEach(s=>{if(!stints[s.driver_number]||s.stint_number>(stints[s.driver_number].stint_number||0))stints[s.driver_number]=s;});
    const intervals={};ivs.forEach(i=>{if(!intervals[i.driver_number]||i.date>intervals[i.driver_number].date)intervals[i.driver_number]=i;});
    const sorted=Object.values(positions).sort((a,b)=>a.position-b.position);
    const maxLap=Math.max(...Object.values(ld).map(l=>l.length),0);
    let ft=Infinity,leader=null;
    sorted.forEach(p=>{
      const dl=ld[p.driver_number]||[];
      if(dl.length>0){const b=Math.min(...dl.filter(l=>l.lap_duration).map(l=>l.lap_duration*1000));if(b<ft)ft=b;}
      if(p.position===1)leader=dm[p.driver_number];
    });
    if(!sorted.length){
      content.innerHTML=renderLiveOffAir('no-data');
      setStats('—','—','STANDBY','R4');return;
    }
    const thRow=`<div class="timing-header-row"><div class="th left">POS</div><div class="th"></div><div class="th left">DRIVER</div><div class="th">GAP</div><div class="th">LAST LAP</div><div class="th">TIRE</div></div>`;
    const rows=sorted.map((p,i)=>{
      const dn=p.driver_number,dr=dm[dn]||{},dl=ld[dn]||[],stint=stints[dn]||{},intv=intervals[dn]||{};
      const ll=dl.length>0?dl[dl.length-1]:null,llms=ll?.lap_duration?ll.lap_duration*1000:null;
      const blms=dl.length>0?Math.min(...dl.filter(l=>l.lap_duration).map(l=>l.lap_duration*1000)):null;
      const isFast=blms&&Math.abs(blms-ft)<1,isPit=ll?.is_pit_out_lap,compound=stint.compound||null;
      const tireAge=stint.lap_start?(maxLap-stint.lap_start+1):null;
      const gapVal=i===0?0:(intv.gap_to_leader!==undefined?intv.gap_to_leader:null);
      const color=tc(DT[dn]||'default');
      const teamName=normalizeTeam(dr.team_name||DT[dn]||'—');
      return`<div class="driver-row ${i===0?'p1-live':''}">
        <div class="pos-cell ${posC(p.position)}">${p.position}</div>
        <div><div class="team-color-bar" style="background:${color}"></div></div>
        <div><div class="d-name">${dr.full_name?dr.full_name.split(' ').pop().toUpperCase():'#'+dn}</div><div class="d-team">${teamName}</div></div>
        <div class="${i===0?'gap-leader-cell':'gap-cell'}">${i===0?'LEADER':fmtGap(gapVal)}</div>
        <div class="lap-cell ${isFast?'lap-fastest':isPit?'lap-pit':'lap-normal'}">${isPit?'PIT':fmtLap(llms)}</div>
        <div class="tire-cell">${tireBadge(compound,tireAge)}</div>
      </div>`;
    }).join('');
    content.innerHTML=thRow+rows;
    setStats(ft<Infinity?fmtLap(ft):'—',leader?.name_acronym||'—',isLive?'LIVE':st.substring(0,4).toUpperCase(),maxLap>0?`L${maxLap}`:session.meeting_name?.substring(0,6).toUpperCase()||'—');
  }catch(e){
    console.error(e);
    // On connection failure show the same friendly off-air view, not a scary error screen
    content.innerHTML=renderLiveOffAir('error');
    setStats('—','—','STANDBY','R4');
  }
}

function nascarDrv(lastName){return NASCAR_CUP_DRIVERS[lastName]||{first:'',team:'—',mfr:'—',num:'—'};}
function nascarMfrColor(m){return MFR_COLOR[m]||MFR_COLOR['default'];}

// Build the "next race" banner for NASCAR
function renderNascarNextBanner(){
  const now=new Date();
  const next=NASCAR_CUP_SCHEDULE.find(r=>new Date(r.date+'T18:00:00Z')>now);
  if(!next)return'';
  const cd=countdown(next.date);
  const cdHTML=cd?`<div class="countdown-num">${cd.num}</div><div class="countdown-label">${cd.unit} AWAY</div>`:`<div class="countdown-num" style="color:var(--green)">NOW</div>`;
  const typeLabel=next.type==='R'?' · ROAD COURSE':next.type==='S'?' · STREET RACE':'';
  return`<div class="next-race-banner">
    <div>
      <div class="next-race-label">Next Race · Round ${next.round}${typeLabel}${next.chase?' · 🏆 CHASE':''}</div>
      <div class="next-race-name">${next.country} ${next.race}</div>
      <div class="next-race-circuit">${next.track}</div>
      <div class="next-race-date">${fmtDate(next.date)}</div>
    </div>
    <div class="countdown-box">${cdHTML}</div>
  </div>`;
}

// Adapter: convert NASCAR_CUP_RESULTS into the same shape renderLiveOffAir expects
function nascarOffAirContext(){
  const lastCompleted=Object.entries(NASCAR_CUP_RESULTS).sort((a,b)=>parseInt(b[0])-parseInt(a[0]))[0];
  if(!lastCompleted)return{series:'nascar',races:{},banner:renderNascarNextBanner(),seriesLabel:'NASCAR',viewTab:'races',switchFn:'switchNascarTab'};
  const [round,res]=lastCompleted;
  const sched=NASCAR_CUP_SCHEDULE.find(s=>s.round===parseInt(round));
  // Shape it like F1 hardcoded race so renderLiveOffAir reads it
  const winner=res.winner, p2=res.p2, p3=res.p3;
  const winInfo=nascarDrv(winner), p2Info=p2?nascarDrv(p2):null, p3Info=p3?nascarDrv(p3):null;
  const fakeRaces={[round]:{round,raceName:sched.race,date:sched.date,
    Circuit:{circuitName:sched.track,Location:{country:sched.country}},
    Results:[
      {Driver:{familyName:winner,nationality:'American'},Constructor:{name:winInfo.mfr}},
      p2?{Driver:{familyName:p2,nationality:'American'},Constructor:{name:p2Info.mfr}}:{Driver:{familyName:'—'},Constructor:{name:'—'}},
      p3?{Driver:{familyName:p3,nationality:'American'},Constructor:{name:p3Info.mfr}}:{Driver:{familyName:'—'},Constructor:{name:'—'}},
    ]}};
  return{series:'nascar',races:fakeRaces,banner:renderNascarNextBanner(),seriesLabel:'NASCAR',lastLabel:`Last Race · Round ${round}`,viewTab:'races',switchFn:'switchNascarTab'};
}

  content.innerHTML=renderLiveOffAir('no-session',nascarOffAirContext());

  setStats('—','—','STANDBY',lastRound?`R${lastRound}`:'—');

    </div>`;
  }).join('');
  let html=banner+`<div class="section-title"><span>2026 Cup Series · ${completed.length} of 36 races</span><span>Tap for details</span></div>`+rows;
  // Selected race detail panel
  if(selectedNascarRace){
    html+=buildNascarRaceDetailHTML(selectedNascarRace.round);
  }
  content.innerHTML=html;
  setStats('—','—','RACE',`${completed.length}/36`);
  if(selectedNascarRace){
    setTimeout(()=>{const el=document.querySelector('.results-header');if(el)el.scrollIntoView({behavior:'smooth'});},100);
  }
}

function buildNascarRaceDetailHTML(round){
  const sched=NASCAR_CUP_SCHEDULE.find(s=>s.round===round);
  const res=NASCAR_CUP_RESULTS[round];
  if(!sched||!res)return'';
  const w=nascarDrv(res.winner);
  const p2=res.p2?nascarDrv(res.p2):null;
  const p3=res.p3?nascarDrv(res.p3):null;
  const header=`<div class="results-header">
    <div class="results-race-name">${sched.country} ${sched.race}</div>
    <div class="results-race-sub">${sched.track} · Round ${sched.round} · ${sched.laps} Laps${sched.type==='R'?' · Road Course':sched.type==='S'?' · Street Course':''}
    ${res.polePos?`<br>🏁 Pole: ${res.polePos}`:''}
    ${res.stage1||res.stage2?`<br>📊 Stages: ${res.stage1?`S1 ${res.stage1}`:'S1 —'} · ${res.stage2?`S2 ${res.stage2}`:'S2 —'}`:''}
    </div>
  </div>`;
  // Podium row — if we have p2/p3, show full; otherwise winner-only state
  let podium;
  if(p2&&p3){
    podium=`<div class="podium-bar">
      <div class="podium-item p2-item">
        <div class="podium-pos">🥈 P2</div>
        <div class="podium-name">${res.p2}</div>
        <div class="podium-team">${p2.team}</div>
        <div class="podium-gap" style="color:${nascarMfrColor(p2.mfr)}">${p2.mfr}</div>
      </div>
      <div class="podium-item p1-item">
        <div class="podium-pos">🏆 WINNER</div>
        <div class="podium-name">${res.winner}</div>
        <div class="podium-team">${w.team}</div>
        <div class="podium-gap" style="color:${nascarMfrColor(w.mfr)}">${w.mfr}</div>
      </div>
      <div class="podium-item p3-item">
        <div class="podium-pos">🥉 P3</div>
        <div class="podium-name">${res.p3}</div>
        <div class="podium-team">${p3.team}</div>
        <div class="podium-gap" style="color:${nascarMfrColor(p3.mfr)}">${p3.mfr}</div>
      </div>
    </div>`;
  } else {
    podium=`<div style="padding:18px;background:var(--surface2);border-bottom:1px solid var(--border);text-align:center;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--yellow);letter-spacing:0.12em;margin-bottom:6px;">🏆 RACE WINNER</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;color:var(--white);">#${w.num} ${res.winner}</div>
      <div style="font-family:'Barlow',sans-serif;font-size:12px;color:var(--muted);margin-top:3px;">${w.team} · <span style="color:${nascarMfrColor(w.mfr)};font-weight:700;">${w.mfr}</span></div>
    </div>
    <div style="padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border);text-align:center;">
      <div style="font-family:'Barlow',sans-serif;font-size:11px;color:var(--muted);">Full classification not yet available — winner verified from NASCAR.com</div>
    </div>`;
  }
  // Race notes
  const notes=res.note?`<div style="padding:14px 16px;background:var(--bg);border-bottom:1px solid var(--border);">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);letter-spacing:0.1em;margin-bottom:4px;">RACE NOTES</div>
    <div style="font-family:'Barlow',sans-serif;font-size:12px;color:var(--text);line-height:1.5;">${res.note}</div>
  </div>`:'';
  return header+podium+notes;
}

function selectNascarRace(round){
  selectedNascarRace=selectedNascarRace&&selectedNascarRace.round===round?null:{round};
  renderNascarRaces();
}

// ── NASCAR DRIVERS CHAMPIONSHIP ───────────────────────────────────────────────
function renderNascarDrivers(){
  const content=document.getElementById('main-content');
  if(currentNascarSeries!=='cup'){
    content.innerHTML=`<div class="state-screen"><div class="state-icon">🏁</div><div class="state-title">${currentNascarSeries.toUpperCase()} Coming Soon</div><div class="state-sub">Cup Series standings are populated. Other series launching soon.</div></div>`;
    setStats('—','—',currentNascarSeries.toUpperCase(),'—');
    return;
  }
  const hdr=`<div class="section-title"><span>Cup Drivers · 2026 · After R12 Watkins Glen</span><span>Top 16 = Chase</span></div>`;
  const rows=NASCAR_CUP_STANDINGS.map(d=>{
    const info=nascarDrv(d.driver);
    const isCutline=d.cutline;
    const inChase=d.pos<=16;
    const isSelected=selectedNascarDriverChamp===d.driver;
    const gapText=d.pos===1?'LEADER':`${d.gap}`;
    const cutlineDivider=isCutline?`<div style="padding:6px 16px;background:#1a0005;border-top:1px solid var(--red);border-bottom:1px solid var(--red);font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--red);letter-spacing:0.15em;text-align:center;font-weight:700;">— CHASE CUTLINE —</div>`:'';
    const breakdown=isSelected?renderNascarDriverBreakdown(d.driver,info,d.points,d.pos):'';
    const posColor=d.pos===1?'var(--yellow)':d.pos<=3?'var(--green)':inChase?'var(--text)':'var(--muted)';
    return`<div>
      ${isCutline?'':''}
      <div class="champ-row" style="${isSelected?'background:#0a0005;border-left:2px solid var(--yellow);':''}" onclick="selectedNascarDriverChamp=selectedNascarDriverChamp==='${d.driver}'?null:'${d.driver}';renderNascarDrivers();">
        <div class="champ-pos" style="color:${posColor}">${d.pos}</div>
        <div class="flag-cell" style="color:${nascarMfrColor(info.mfr)};font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;">#${info.num}</div>
        <div>
          <div class="champ-name">${d.driver}</div>
          <div class="champ-team-sm" style="color:${nascarMfrColor(info.mfr)}">${info.team}</div>
        </div>
        <div class="champ-pts">${d.points}</div>
        <div class="champ-gap" style="color:${d.pos===1?'var(--yellow)':'var(--muted)'}">${gapText}</div>
      </div>
      ${breakdown}
      ${d.pos===16?`<div style="padding:6px 16px;background:#1a0005;border-top:1px solid var(--red);border-bottom:1px solid var(--red);font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--red);letter-spacing:0.15em;text-align:center;font-weight:700;">— CHASE CUTLINE —</div>`:''}
    </div>`;
  }).join('');
  content.innerHTML=hdr+rows;
  setStats(`${NASCAR_CUP_STANDINGS[0].points} pts`,NASCAR_CUP_STANDINGS[0].driver,'DRIVERS','R12/36');
}

function renderNascarDriverBreakdown(name,info,points,pos){
  // Count wins for this driver from completed races
  const wins=Object.values(NASCAR_CUP_RESULTS).filter(r=>r.winner===name).length;
  const winRaces=Object.entries(NASCAR_CUP_RESULTS).filter(([_,r])=>r.winner===name).map(([rd,r])=>{
    const sched=NASCAR_CUP_SCHEDULE.find(s=>s.round===parseInt(rd));
    return`<div style="display:grid;grid-template-columns:32px 1fr auto;padding:6px 16px;border-bottom:1px solid #141414;align-items:center;gap:10px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);">R${rd}</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text);">${sched?.race||''}</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--yellow);letter-spacing:0.08em;">🏆 WIN</div>
    </div>`;
  }).join('');
  return`<div style="background:var(--surface2);border-top:1px solid var(--border);border-bottom:2px solid var(--yellow);">
    <div style="padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);">
      <div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--white);">${info.first} ${name}</div>
        <div style="font-family:'Barlow',sans-serif;font-size:11px;color:${nascarMfrColor(info.mfr)};margin-top:2px;">${info.team} · #${info.num} · ${info.mfr}</div>
      </div>
      <button onclick="selectedNascarDriverChamp=null;renderNascarDrivers();" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 8px;">✕</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);">
      <div style="background:var(--bg);padding:10px;text-align:center;">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);letter-spacing:0.1em;">CHAMPIONSHIP</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:${pos===1?'var(--yellow)':pos<=16?'var(--text)':'var(--muted)'};">P${pos}</div>
      </div>
      <div style="background:var(--bg);padding:10px;text-align:center;">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);letter-spacing:0.1em;">POINTS</div>
        <div style="font-family:'Share Tech Mono',monospace;font-size:18px;color:var(--yellow);">${points}</div>
      </div>
      <div style="background:var(--bg);padding:10px;text-align:center;">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);letter-spacing:0.1em;">WINS</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:${wins>0?'var(--yellow)':'var(--muted)'};">${wins}</div>
      </div>
    </div>
    ${wins>0?`<div style="padding:10px 16px;font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);letter-spacing:0.1em;border-bottom:1px solid var(--border);">2026 WINS</div>`:''}
    ${winRaces}
  </div>`;
}

// ── NASCAR MANUFACTURERS ──────────────────────────────────────────────────────
function renderNascarMfrs(){
  const content=document.getElementById('main-content');
  if(currentNascarSeries!=='cup'){
    content.innerHTML=`<div class="state-screen"><div class="state-icon">🏁</div><div class="state-title">${currentNascarSeries.toUpperCase()} Coming Soon</div><div class="state-sub">Cup Series manufacturer standings are populated.</div></div>`;
    setStats('—','—',currentNascarSeries.toUpperCase(),'—');
    return;
  }
  const hdr=`<div class="section-title"><span>Cup Manufacturers · 2026 · After R12</span><span>Wins through Watkins Glen</span></div>`;
  const note=`<div style="padding:12px 16px;background:#1a1a05;border-bottom:1px solid var(--border);font-family:'Barlow',sans-serif;font-size:11px;color:var(--yellow);line-height:1.5;">
    ℹ️ NASCAR no longer publicly publishes official manufacturer points after each race. Wins shown below are verified from NASCAR.com.
  </div>`;
  const rows=NASCAR_CUP_MFRS.map(m=>{
    const isSelected=selectedNascarMfrChamp===m.mfr;
    const breakdown=isSelected?renderNascarMfrBreakdown(m):'';
    return`<div>
      <div class="champ-row" style="${isSelected?`background:#0a0005;border-left:2px solid ${nascarMfrColor(m.mfr)};`:''}" onclick="selectedNascarMfrChamp=selectedNascarMfrChamp==='${m.mfr}'?null:'${m.mfr}';renderNascarMfrs();">
        <div class="champ-pos" style="color:${m.pos===1?'var(--yellow)':m.pos===2?'#c0c0c0':'#cd7f32'}">${m.pos}</div>
        <div class="flag-cell" style="color:${nascarMfrColor(m.mfr)};font-size:18px;">●</div>
        <div>
          <div class="champ-name" style="color:${nascarMfrColor(m.mfr)};">${m.mfr}</div>
          <div class="champ-team-sm">${m.drivers.length} winning driver${m.drivers.length>1?'s':''}</div>
        </div>
        <div class="champ-pts" style="color:${nascarMfrColor(m.mfr)};">${m.wins}</div>
        <div class="champ-gap">WINS</div>
      </div>
      ${breakdown}
    </div>`;
  }).join('');
  content.innerHTML=hdr+note+rows;
  setStats(`${NASCAR_CUP_MFRS[0].wins} wins`,NASCAR_CUP_MFRS[0].mfr,'MFRS','R12/36');
}

function renderNascarMfrBreakdown(m){
  // List each win for this manufacturer with race + driver
  const wins=Object.entries(NASCAR_CUP_RESULTS).filter(([_,r])=>nascarDrv(r.winner).mfr===m.mfr).map(([rd,r])=>{
    const sched=NASCAR_CUP_SCHEDULE.find(s=>s.round===parseInt(rd));
    return`<div style="display:grid;grid-template-columns:32px 1fr auto;padding:7px 16px;border-bottom:1px solid #141414;align-items:center;gap:10px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);">R${rd}</div>
      <div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--text);">${sched?.race||''}</div>
        <div style="font-family:'Barlow',sans-serif;font-size:10px;color:var(--muted);">${r.winner}</div>
      </div>
      <div style="font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);">${fmtDate(sched?.date)}</div>
    </div>`;
  }).join('');
  return`<div style="background:var(--surface2);border-top:1px solid var(--border);border-bottom:2px solid ${nascarMfrColor(m.mfr)};">
    <div style="padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);">
      <div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:${nascarMfrColor(m.mfr)};">${m.mfr} — 2026 Wins</div>
        <div style="font-family:'Barlow',sans-serif;font-size:11px;color:var(--muted);margin-top:2px;">${m.wins} race win${m.wins>1?'s':''} · ${m.drivers.join(', ')}</div>
      </div>
      <button onclick="selectedNascarMfrChamp=null;renderNascarMfrs();" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 8px;">✕</button>
    </div>
    ${wins}
  </div>`;
}

// ── NASCAR ROUTER ─────────────────────────────────────────────────────────────
function renderNascar(){
  if(currentNascarTab==='races')return renderNascarRaces();
  if(currentNascarTab==='drivers')return renderNascarDrivers();
  if(currentNascarTab==='mfrs')return renderNascarMfrs();
  return renderNascarLive();
}

function switchNascarTab(tab){
  currentNascarTab=tab;
  selectedNascarRace=null;
  selectedNascarDriverChamp=null;
  selectedNascarMfrChamp=null;
  document.querySelectorAll('#nascar-submenu .f1-sub-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('ntab-'+tab)?.classList.add('active');
  renderNascar();
}

function switchNascarSeries(s){
  currentNascarSeries=s;
  selectedNascarRace=null;
  selectedNascarDriverChamp=null;
  selectedNascarMfrChamp=null;
  document.querySelectorAll('.nascar-series-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('nseries-'+s)?.classList.add('active');
  renderNascar();
}


async function renderF1(){
  if(currentF1Tab==='races')return renderRaceSelector();
  if(currentF1Tab==='drivers')return renderDrivers();
  if(currentF1Tab==='constructors')return renderConstructors();
  return renderLive();
}

function switchSeries(s){
  currentSeries=s;
  document.querySelectorAll('.series-tab').forEach((t,i)=>t.classList.toggle('active',['f1','nascar','motogp','wrc','indycar','gt3'][i]===s));
  // Toggle the right submenu and tier bar
  document.getElementById('f1-submenu').style.display=s==='f1'?'flex':'none';
  document.getElementById('nascar-submenu').style.display=s==='nascar'?'flex':'none';
  document.getElementById('nascar-series-bar').style.display=s==='nascar'?'flex':'none';
  if(s==='f1'){renderF1();return;}
  if(s==='nascar'){renderNascar();return;}
  // All other series — placeholder
  document.getElementById('main-content').innerHTML=`<div class="state-screen"><div class="state-icon">🏎</div><div class="state-title">${s.toUpperCase()} Coming Soon</div><div class="state-sub">F1 and NASCAR are live now. More series launching soon.</div></div>`;
  setStats('—','—',s.toUpperCase(),'—');
}

function switchF1Tab(tab){
  currentF1Tab=tab;
  selectedRace=null;
  selectedDriver=null;
  selectedDriverChamp=null;
  selectedConstructorChamp=null;
  document.querySelectorAll('.f1-sub-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab)?.classList.add('active');
  renderF1();
}

function refresh(){
  cachedResults={};cachedStandings=null;cachedConstructors=null;cachedLaps={};cachedFastestLaps={};
  const btn=document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  const p = currentSeries==='nascar' ? Promise.resolve(renderNascar()) : renderF1();
  p.finally(()=>btn.classList.remove('spinning'));
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.getElementById('f1-submenu').style.display='flex';
renderF1();
setInterval(()=>{if(currentSeries==='f1'&&currentF1Tab==='live'&&isLive)renderLive();},30000);
</script>
</body>
</html>
